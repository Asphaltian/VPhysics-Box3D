name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pipx install clang-format==20.1.8

      - name: Check formatting
        run: find src -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror

  windows:
    name: ${{ matrix.preset }} ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        preset: [ windows-x64, windows-x86 ]
        configuration: [ release, debug ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.configuration }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: vphysics-${{ matrix.preset }}-${{ matrix.configuration }}
          path: |
            build/${{ matrix.preset }}/src/*/vphysics.dll
            build/${{ matrix.preset }}/src/*/vphysics.pdb
          if-no-files-found: error

  linux:
    name: ${{ matrix.preset }} ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ linux-x64, linux-x86, dedicated-linux-x64, dedicated-linux-x86 ]
        configuration: [ release, debug ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Trust checkout
        run: git config --global --add safe.directory "*"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.configuration }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: vphysics-${{ matrix.preset }}-${{ matrix.configuration }}
          path: |
            build/${{ matrix.preset }}/src/*/vphysics*.so
            build/${{ matrix.preset }}/src/*/vphysics*.so.debug
          if-no-files-found: error
